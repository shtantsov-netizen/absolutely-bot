services:
  - type: web
    name: bso-bot
    runtime: python
    repo: https://github.com/shtantsov-netizen/absolutely-bot
    branch: main
    buildCommand: |
      apt-get update && apt-get install -y tesseract-ocr tesseract-ocr-rus
      pip install -r requirements.txt
    startCommand: python bso_bot.py
    plan: free
